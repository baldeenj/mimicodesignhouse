fragment ArticleParts on Article {
  __typename
  title
  tag {
    ... on Category {
      __typename
      name
    }
    ... on Document {
      _sys {
        filename
        basename
        hasReferences
        breadcrumbs
        path
        relativePath
        extension
      }
      id
    }
  }
  date
  heroImage
  summary
  body
}

fragment CategoryParts on Category {
  __typename
  name
}

fragment VlogParts on Vlog {
  __typename
  title
  episode
  date
  videoUrl
  thumbnailUrl
  summary
  body
}

fragment PortfolioParts on Portfolio {
  __typename
  client
  title
  description
  tags
  imageUrl
  featured
  body
}
